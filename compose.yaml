services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: khabarfori
      POSTGRES_USER: khabarfori
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U khabarfori"]
      interval: 5s
      retries: 10
  migrate:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://khabarfori:${POSTGRES_PASSWORD}@db:5432/khabarfori
      DIRECT_URL: postgresql://khabarfori:${POSTGRES_PASSWORD}@db:5432/khabarfori
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      db: {condition: service_healthy}
  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://khabarfori:${POSTGRES_PASSWORD}@db:5432/khabarfori
      DIRECT_URL: postgresql://khabarfori:${POSTGRES_PASSWORD}@db:5432/khabarfori
    ports: ["127.0.0.1:4000:4000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      retries: 5
  admin:
    build:
      context: .
      dockerfile: production/Dockerfile.admin
    environment:
      KHABARFORI_API_URL: http://api:4000
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api: {condition: service_healthy}
volumes:
  postgres_data:
