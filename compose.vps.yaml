name: khabarfori
x-api-environment: &api-environment
  NODE_ENV: production
  DATABASE_URL: postgresql://khabarfori:${POSTGRES_PASSWORD:?Configure .env.vps}@db:5432/khabarfori
  DIRECT_URL: postgresql://khabarfori:${POSTGRES_PASSWORD}@db:5432/khabarfori
  JWT_SECRET: ${JWT_SECRET:?Configure .env.vps}
  ADMIN_EMAIL: ${ADMIN_EMAIL:?Configure .env.vps}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Configure .env.vps}
  CORS_ORIGINS: https://${APP_DOMAIN:?Configure .env.vps}
  ENABLE_API_DOCS: 'false'
  SEED_DEMO: 'false'
  TELEGRAM_INGEST_TOKEN: ${TELEGRAM_INGEST_TOKEN:-}
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: khabarfori
      POSTGRES_USER: khabarfori
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U khabarfori -d khabarfori']
      interval: 5s
      timeout: 5s
      retries: 20
  migrate:
    build: ./backend
    environment: *api-environment
    command: ['npm', 'run', 'db:migrate']
    depends_on:
      db:
        condition: service_healthy
  seed:
    build: ./backend
    environment: *api-environment
    command: ['npm', 'run', 'db:seed']
    depends_on:
      migrate:
        condition: service_completed_successfully
  api:
    build: ./backend
    restart: unless-stopped
    environment: *api-environment
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:4000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
  admin:
    build:
      context: .
      dockerfile: production/Dockerfile.admin
    restart: unless-stopped
    environment:
      KHABARFORI_API_URL: http://api:4000
      KHABARFORI_PUBLIC_ORIGIN: https://${APP_DOMAIN}
    depends_on:
      api:
        condition: service_healthy
  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/vps/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - admin
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
