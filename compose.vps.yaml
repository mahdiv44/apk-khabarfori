name: khabarfori
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: khabarfori
      POSTGRES_USER: khabarfori
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.vps}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U khabarfori -d khabarfori]
      interval: 5s
      retries: 20
  migrate:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://khabarfori:${POSTGRES_PASSWORD}@db:5432/khabarfori
      DIRECT_URL: postgresql://khabarfori:${POSTGRES_PASSWORD}@db:5432/khabarfori
    command: [npm, run, db:migrate]
    depends_on: {db: {condition: service_healthy}}
  seed:
    build: ./backend
    env_file: .env.vps
    environment:
      DATABASE_URL: postgresql://khabarfori:${POSTGRES_PASSWORD}@db:5432/khabarfori
      DIRECT_URL: postgresql://khabarfori:${POSTGRES_PASSWORD}@db:5432/khabarfori
    command: [npm, run, db:seed]
    depends_on: {migrate: {condition: service_completed_successfully}}
  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env.vps
    environment:
      DATABASE_URL: postgresql://khabarfori:${POSTGRES_PASSWORD}@db:5432/khabarfori
      DIRECT_URL: postgresql://khabarfori:${POSTGRES_PASSWORD}@db:5432/khabarfori
    depends_on: {seed: {condition: service_completed_successfully}}
  admin:
    build: {context: ., dockerfile: production/Dockerfile.admin}
    restart: unless-stopped
    environment:
      KHABARFORI_API_URL: http://api:4000
      KHABARFORI_PUBLIC_ORIGIN: https://${APP_DOMAIN}
    depends_on: {api: {condition: service_started}}
  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    environment: {APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in .env.vps}}
    ports: ["80:80", "443:443"]
    volumes: [./deploy/vps/Caddyfile:/etc/caddy/Caddyfile:ro, caddy_data:/data, caddy_config:/config]
    depends_on: [admin]
volumes: {postgres_data: {}, caddy_data: {}, caddy_config: {}}
